localesRoot: src/i18n/locales
repoRoot: .
baseLocale: en-US
targetLocales:
  - zh-CN
doctor:
  excludedDirectories:
    - .astro
    - .git
    - dist
    - node_modules
    - vendor
  textFileExtensions:
    - .astro
    - .css
    - .js
    - .json
    - .md
    - .mdx
    - .mjs
    - .ts
    - .yaml
    - .yml
  allowlist:
    legacy-language-change-call: []
    legacy-locale-path: []
    legacy-ui-language-literal: []
    legacy-ui-language-union: []
